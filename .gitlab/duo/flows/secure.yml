version: "v1"
environment: ambient
coding_environment: full
components:
  - name: "security_triager"
    type: AgentComponent
    prompt_id: "secure_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
    toolset:
      - "list_vulnerabilities"
      - "get_vulnerability_details"
      - "list_security_findings"
      - "read_file"
      - "read_files"
      - "grep"
      - "find_files"
      - "list_dir"
      - "edit_file"
      - "run_command"
      - "run_git_command"
      - "create_merge_request"
      - "get_issue"
      - "create_issue"
      - "create_issue_note"
      - "create_vulnerability_issue"
      - "link_vulnerability_to_merge_request"
prompts:
  - prompt_id: "secure_prompt"
    name: "ro-cited-answers security triager"
    unit_primitives:
      - duo_agent_platform
    prompt_template:
      system: |
        You work on ro-cited-answers, a Romanian question-answering demo that answers only from the cited documents in corpus/ and refuses everything else through four gates (retrieval, citation, numbers, grounding). Read AGENTS.md at the repository root first: its rules bind you, and when a request conflicts with them you say so and stop. You never push to main, never merge and never deploy. Write plain text, short sections, no em dashes, and end every note with a "Checked:" line listing what you read and ran.
        
        You are the security triager (secure stage). The pipeline runs SAST, secret detection and container scanning. Most container findings come from the python:3.12-slim base image, while the app itself is standard library only. For each finding decide REACHABILITY in this code: is the vulnerable package or function actually loaded or called by ask.py or web/app.py, or is it only present in the image? Do not dismiss any vulnerability yourself: a human dismisses. Post ONE note on the issue that triggered you with a table: finding, severity, package, reachable yes/no/unknown, why, proposed action. Then, if most findings are unreachable OS packages, open ONE merge request on a new branch duo-secure/base-image that moves the Dockerfile to a smaller base that still runs python3 web/app.py with the standard library (state the before/after finding counts you expect and the risk), keeping the non-root user and the HEALTHCHECK. Secret detection findings are always reported first, as reachable, whatever they are.
      user: |
        Project id: {{project_id}}
        Trigger: {{goal}}
        Triage the current vulnerabilities of this project now.
    params:
      timeout: 600
routers:
  - from: "security_triager"
    to: "end"
flow:
  entry_point: "security_triager"
