# RO Cited Answers: the post-code lifecycle, end to end.
#
#   verify    unit tests on the gates, the eval set is reproducible, the app boots
#   secure    SAST and secret detection on every change
#   package   one image per commit (GitLab registry + Artifact Registry), then a container scan
#   deploy    a Cloud Run CANDIDATE revision that receives no traffic
#   validate  the candidate must pass the live check (real page, real model, gates firing)
#   release   promote to 100% traffic, re-check, ROLL BACK automatically if the check fails,
#             then a GitLab release that names the revision
#   configure the live Cloud Run settings are compared with deploy/service-config.json after every
#             release and on every scheduled run; drift is put back to the file automatically
#             (same candidate, check, promote, rollback path), and the rca-configure flow reports it
#   monitor   a scheduled pipeline re-checks production and opens an issue when it fails
#
# Auth to Google Cloud uses Workload Identity Federation: GitLab signs a JWT for the
# job, Google trusts gitlab.com, and no service account key exists anywhere.

stages: [verify, secure, package, deploy, validate, release, configure, monitor]

variables:
  GCP_PROJECT: ro-cited-gitlab
  GCP_PROJECT_NUMBER: "210002791432"
  GCP_REGION: europe-north1
  RUN_SERVICE: ro-cited
  AR_REPO: ro-cited
  AR_IMAGE: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/app
  # GitLab Observability (group 144951419): the app sends one span per question here.
  # Ingestion needs no key (checked 16.10.2026: empty batch 200, nonsense path 404, wrong group 410).
  OTEL_EXPORTER_OTLP_ENDPOINT: https://144951419.otel.gitlab-o11y.com:14318
  APP_VERSION: ${CI_COMMIT_SHORT_SHA}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Scheduled runs are the production monitor only: the security templates have
    # their own rules, so they are switched off with their documented variables.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
        CONTAINER_SCANNING_DISABLED: "true"
    - if: $CI_COMMIT_BRANCH

.on_default_branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.not_scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.gcp_auth:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab

# ---------------------------------------------------------------- verify
gates-offline:
  stage: verify
  image: python:3.12-slim
  extends: .not_scheduled
  script:
    - python3 test_gates_offline.py
    - python3 test_otel_offline.py
    - python3 test_config_offline.py
    - python3 -m py_compile ask.py calibrate.py test_gates.py test_gates_offline.py test_otel_offline.py test_config_offline.py eval/run_eval.py eval/build_items.py web/app.py web/otel.py deploy/*.py

eval-set-reproducible:
  stage: verify
  image: python:3.12-slim
  extends: .not_scheduled
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    # The committed eval items must be exactly what the builder produces from the sources.
    - cd eval && python3 build_items.py && git diff --exit-code items.jsonl

app-boots:
  stage: verify
  image: python:3.12-slim
  extends: .not_scheduled
  script:
    # Boots on the committed Qwen3 vector cache (the one the image ships), with no
    # model key and no model call, and must pass the content checks (real page,
    # UTF-8, nonsense path 404). Reproduced on a clean checkout before pushing.
    # Telemetry off here: a CI boot must not send spans labelled production.
    - (PORT=8080 RO_BACKEND=openai RO_AUDIT=/tmp/audit.jsonl OTEL_EXPORTER_OTLP_ENDPOINT= python3 web/app.py > app.log 2>&1 &)
    - for i in $(seq 1 20); do python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')" 2>/dev/null && break; sleep 1; done
    - python3 deploy/smoke.py http://127.0.0.1:8080 --no-model
  after_script:
    - cat app.log || true

deploy-tools-check:
  # Proves, in every pipeline including merge requests, what promote relies on: git exists in the
  # promote image, the head of main can be read with the job's clone URL, and the ancestor test works.
  stage: verify
  image: google/cloud-sdk:slim
  extends: .not_scheduled
  variables:
    GIT_DEPTH: "0"
  script:
    - git --version
    - HEAD_SHA=$(git ls-remote "$CI_REPOSITORY_URL" "refs/heads/$CI_DEFAULT_BRANCH" | cut -f1)
    - test -n "$HEAD_SHA" || { echo "cannot read the head of $CI_DEFAULT_BRANCH"; exit 1; }
    - echo "head of $CI_DEFAULT_BRANCH = $HEAD_SHA"
    - git fetch -q origin "$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$(git rev-parse --short=8 FETCH_HEAD~1)" FETCH_HEAD || { echo "ancestor test FAILED"; exit 1; }
    - echo "ancestor test ok"
    - if git merge-base --is-ancestor FETCH_HEAD FETCH_HEAD~1; then echo "non-ancestor test FAILED"; exit 1; fi
    - echo "non-ancestor test ok"

# ---------------------------------------------------------------- secure
# The templates name their analyzer jobs themselves (and rename them between
# GitLab versions), so the stage is set on the shared hidden job they all extend.
.sast-analyzer:
  stage: secure

.secret-analyzer:
  stage: secure

sast:
  stage: secure

secret_detection:
  stage: secure

# ---------------------------------------------------------------- package
build-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  extends: [.gcp_auth, .not_scheduled]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache python3 >/dev/null
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg APP_VERSION="$APP_VERSION" -t "$CI_REGISTRY_IMAGE:$APP_VERSION" .
    - docker push "$CI_REGISTRY_IMAGE:$APP_VERSION"
    # Only the default branch ships to Google Cloud.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        python3 deploy/gcp_token.py > gcp-token.txt
        python3 deploy/ar_ensure.py gcp-token.txt
        docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev" < gcp-token.txt
        docker tag "$CI_REGISTRY_IMAGE:$APP_VERSION" "$AR_IMAGE:$APP_VERSION"
        docker push "$AR_IMAGE:$APP_VERSION"
        rm -f gcp-token.txt
      fi

container_scanning:
  stage: package
  needs:
    - job: build-image
      optional: true
  extends: .not_scheduled
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# ---------------------------------------------------------------- deploy
deploy-candidate:
  stage: deploy
  image: google/cloud-sdk:slim
  extends: [.gcp_auth, .on_default_branch]
  needs: [build-image, gates-offline, app-boots]
  script:
    - python3 deploy/gcp_token.py > gcp-token.txt
    - deploy/cloudrun.sh candidate "$AR_IMAGE:$APP_VERSION"
    - echo "CANDIDATE_URL=$(deploy/cloudrun.sh url candidate)" > candidate.env
    - cat candidate.env
    - rm -f gcp-token.txt
  artifacts:
    reports:
      dotenv: candidate.env

# ---------------------------------------------------------------- validate
validate-candidate:
  stage: validate
  image: python:3.12-slim
  extends: .on_default_branch
  needs: [deploy-candidate]
  variables:
    SMOKE_EXPECT_TELEMETRY: "1"
  script:
    - python3 deploy/smoke.py "$CANDIDATE_URL"

# ---------------------------------------------------------------- release
promote:
  stage: release
  image: google/cloud-sdk:slim
  extends: [.gcp_auth, .on_default_branch]
  needs: [validate-candidate, container_scanning]
  resource_group: production
  variables:
    GIT_DEPTH: "0"
    SMOKE_EXPECT_TELEMETRY: "1"
  environment:
    name: production
  script:
    - python3 deploy/gcp_token.py > gcp-token.txt
    # Never promote an older commit over a newer one: when two merges land together, only the
    # pipeline of the commit that is still the head of main promotes (the newer one carries both).
    # 1) the head of main via git on the job's clone URL, 3 tries, errors shown;
    # 2) if that cannot be read: skip when production already serves a commit that contains this one.
    - |
      HEAD_SHA=""
      for i in 1 2 3; do
        HEAD_SHA=$(git ls-remote "$CI_REPOSITORY_URL" "refs/heads/$CI_DEFAULT_BRANCH" | cut -f1) && [ -n "$HEAD_SHA" ] && break
        echo "head-of-main lookup failed (try $i)"; sleep 5
      done
      if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$CI_COMMIT_SHA" ]; then
        echo "main has moved on to $HEAD_SHA: this commit is not promoted, the newer pipeline deploys it"
        echo "PROMOTED=false" > prod.env; rm -f gcp-token.txt
        exit 0
      fi
      if [ -z "$HEAD_SHA" ]; then
        SERVING=$(deploy/cloudrun.sh serving-commit || true)
        echo "WARNING: head of main unreadable; production serves ${SERVING:-unknown}"
        if [ -n "$SERVING" ] && [ "$SERVING" != "$CI_COMMIT_SHORT_SHA" ] && git merge-base --is-ancestor "$CI_COMMIT_SHA" "$SERVING" 2>/dev/null; then
          echo "production already serves a newer commit that contains this one: not promoted"
          echo "PROMOTED=false" > prod.env; rm -f gcp-token.txt
          exit 0
        fi
      fi
    - deploy/cloudrun.sh promote
    - PROD_URL=$(deploy/cloudrun.sh url)
    - printf 'PROMOTED=true\nPROD_URL=%s\n' "$PROD_URL" > prod.env
    # The automatic rollback: production must pass the same check, or traffic goes back.
    - |
      if ! python3 deploy/smoke.py "$PROD_URL"; then
        echo "production check FAILED after promote: rolling back"
        deploy/cloudrun.sh rollback
        exit 1
      fi
    # Only after production passed: tidy the candidate tags of older commits (best effort).
    - deploy/cloudrun.sh cleanup || true
    - rm -f gcp-token.txt
  artifacts:
    paths: [previous-revision.txt]
    reports:
      dotenv: prod.env

release-notes:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends: .on_default_branch
  needs: [promote]
  # A commit that was not promoted (main had moved on) gets no release: exit 3 is allowed and skips it.
  allow_failure:
    exit_codes: [3]
  script:
    - if [ "${PROMOTED:-}" != "true" ]; then echo "not promoted, no release for this commit"; exit 3; fi
    - echo "release v$CI_PIPELINE_IID at $PROD_URL"
  release:
    tag_name: v$CI_PIPELINE_IID
    name: "v$CI_PIPELINE_IID ($CI_COMMIT_SHORT_SHA)"
    description: "Deployed $CI_COMMIT_SHORT_SHA to Cloud Run ($GCP_REGION). Live: $PROD_URL. Passed the gate tests, SAST, secret detection, container scan, the candidate check and the production check."
    ref: $CI_COMMIT_SHA

# ---------------------------------------------------------------- configure
# deploy/service-config.json is the one place the production settings live (cloudrun.sh deploys from it).
# This job reads the live service and the revision that serves traffic, and compares both with the file.
# Drift (a console edit, a manual gcloud call) is reconciled the GitOps way: the serving image is
# redeployed with the declared settings through the same candidate, check, promote and rollback path,
# and the job then FAILS on purpose, so the rca-configure flow opens the incident and explains it.
# CONFIG_DRIFT_DRILL=1 on a scheduled run first plants a harmless drift (max instances 3) to prove it.
config-drift:
  stage: configure
  image: google/cloud-sdk:slim
  extends: .gcp_auth
  resource_group: production
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: promote
      optional: true
  script:
    - python3 deploy/gcp_token.py > gcp-token.txt
    - |
      if [ "${CONFIG_DRIFT_DRILL:-}" = "1" ] && [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        echo "DRILL: planting a harmless drift (max instances 3) the way a console edit would"
        gcloud --quiet --project="$GCP_PROJECT" --access-token-file=gcp-token.txt run services update "$RUN_SERVICE" \
          --region="$GCP_REGION" --max-instances=3
      fi
    - deploy/cloudrun.sh live-json live
    - set +e; python3 deploy/service_config.py check live/service.json --serving live/serving.json | tee drift.txt; rc=${PIPESTATUS[0]}; set -e
    - if [ "$rc" = 0 ]; then rm -f gcp-token.txt; exit 0; fi
    - if [ "$rc" != 1 ]; then echo "could not read the live configuration"; rm -f gcp-token.txt; exit 2; fi
    # Reconcile: same image and same app version as production, settings from the file.
    # The image comes from the same serving.json that was compared: one definition of "serving" for both.
    - IMAGE=$(python3 -c 'import json; print(json.load(open("live/serving.json"))["spec"]["containers"][0]["image"])')
    - test -n "$IMAGE"
    - export APP_VERSION=$(python3 -c 'import json; e=json.load(open("live/serving.json"))["spec"]["containers"][0].get("env",[]); print(next((x.get("value","") for x in e if x["name"]=="APP_VERSION"), ""))')
    - export RUN_TAG="cfg-${CI_PIPELINE_IID}"
    - echo "reconciling $IMAGE (version $APP_VERSION) to deploy/service-config.json as tag $RUN_TAG"
    - deploy/cloudrun.sh candidate "$IMAGE"
    - python3 deploy/smoke.py "$(deploy/cloudrun.sh url candidate)" --no-model
    - deploy/cloudrun.sh promote
    - |
      if ! python3 deploy/smoke.py "$(deploy/cloudrun.sh url)" --no-model; then
        echo "production check FAILED after reconcile: rolling back"
        deploy/cloudrun.sh rollback
        exit 1
      fi
    - deploy/cloudrun.sh live-json live-after
    # If production still differs after a deploy FROM the file, the checker or the file is wrong: say so (exit 2).
    - set +e; python3 deploy/service_config.py check live-after/service.json --serving live-after/serving.json | tee reconciled.txt; rc=${PIPESTATUS[0]}; set -e
    - |
      if [ "$rc" != 0 ]; then echo "drift persists after reconcile, so the checker or deploy/service-config.json is wrong"; rm -f gcp-token.txt; exit 2; fi
    - rm -f gcp-token.txt
    - echo "CONFIG DRIFT found and reconciled; failing on purpose so rca-configure reports it"
    - exit 1
  artifacts:
    when: always
    paths: [drift.txt, reconciled.txt, live/serving-revision.txt, live-after/serving-revision.txt]

# Read-only on merge requests: what production would change if this MR's service-config.json were merged.
config-preview:
  stage: configure
  image: google/cloud-sdk:slim
  extends: .gcp_auth
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs: []
  allow_failure: true
  script:
    - python3 deploy/gcp_token.py > gcp-token.txt
    - deploy/cloudrun.sh live-json live
    - rm -f gcp-token.txt
    - python3 deploy/service_config.py check live/service.json --serving live/serving.json

# ---------------------------------------------------------------- monitor
monitor-production:
  stage: monitor
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      if ! python3 deploy/smoke.py "$PROD_URL_STATIC" --no-model; then
        if [ -n "${MONITOR_TOKEN:-}" ]; then
          python3 - <<'EOF'
      import json, os, urllib.request
      body = {"title": "Production check failed (scheduled monitor)",
              "description": f"The scheduled check against {os.environ['PROD_URL_STATIC']} failed in pipeline {os.environ['CI_PIPELINE_URL']}. See the job log for which check failed.",
              "labels": "incident,monitor"}
      req = urllib.request.Request(f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/issues",
          data=json.dumps(body).encode(), headers={"PRIVATE-TOKEN": os.environ["MONITOR_TOKEN"], "Content-Type": "application/json"})
      print("issue opened:", json.load(urllib.request.urlopen(req))["web_url"])
      EOF
        fi
        exit 1
      fi
