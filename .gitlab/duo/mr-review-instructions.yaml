instructions:
  - name: Gates and calibration
    fileFilters:
      - "ask.py"
      - "gate_a.json"
      - "calibrate.py"
    instructions: |
      This file decides when the system refuses. Check that no threshold (MIN_SIM, the margin, MIN_GROUND) was lowered and no
      gate was skipped or short-circuited. If any threshold or gate logic changed, the merge request description must carry the
      calibrate.py output and the eval results before and after (AGENTS.md rule 1). Flag any path that returns an answer without
      a citation (rule 2).
  - name: Corpus
    fileFilters:
      - "corpus/**"
    instructions: |
      Every corpus change must name its official source (URL and the date it was read). Check that Romanian diacritics are kept
      and that no number was changed without the source saying so.
  - name: Eval set
    fileFilters:
      - "eval/**"
    instructions: |
      eval/items.jsonl is generated by eval/build_items.py and must not be edited by hand.
  - name: Pipeline and deployment
    fileFilters:
      - ".gitlab-ci.yml"
      - "deploy/**"
      - "Dockerfile"
    instructions: |
      Check that the candidate -> check -> promote -> check -> rollback order is kept, that no job deploys outside main, that no
      secret or service account key appears, and that the image stays standard library only.
  - name: Web app
    fileFilters:
      - "web/**"
    instructions: |
      Check the rate and daily caps are kept, every answer still passes through the gates, errors stay in Romanian with
      diacritics, and unknown paths still return 404.
