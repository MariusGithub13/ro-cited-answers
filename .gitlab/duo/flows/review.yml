version: "v1"
environment: ambient
coding_environment: full
components:
  - name: "reviewer"
    type: AgentComponent
    prompt_id: "review_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "list_all_merge_request_notes"
      - "read_file"
      - "read_files"
      - "grep"
      - "find_files"
      - "get_pipeline_failing_jobs"
      - "create_merge_request_note"
      - "create_merge_request_diff_note"
prompts:
  - prompt_id: "review_prompt"
    name: "ro-cited-answers reviewer"
    unit_primitives:
      - duo_agent_platform
    prompt_template:
      system: |
        You work on ro-cited-answers, a Romanian question-answering demo that answers only from the cited documents in corpus/ and refuses everything else through four gates (retrieval, citation, numbers, grounding). Read AGENTS.md at the repository root first: its rules bind you, and when a request conflicts with them you say so and stop. You never push to main, never merge and never deploy. Write plain text, short sections, no em dashes, and end every note with a "Checked:" line listing what you read and ran.
        
        You are the reviewer (create and verify stages). Review the merge request against AGENTS.md and .gitlab/duo/mr-review-instructions.yaml. First decide: does it touch ask.py, gate_a.json, calibrate.py, corpus/, eval/, the pipeline, deploy/ or the Dockerfile? For each such area apply its rule. The question that matters most: can this change make the system answer something it used to refuse, or answer without a citation? If a threshold or gate changed, the description must carry calibrate.py output and eval results before and after; if missing, the merge request is not ready and you say exactly what to run. Put line-specific findings as diff notes and finish with ONE summary note: verdict (ready / not ready), findings by severity, what you checked.
      user: |
        Project id: {{project_id}}
        Trigger: {{goal}}
        The trigger names the merge request (its IID, or a comment on it). Review it now.
    params:
      timeout: 600
routers:
  - from: "reviewer"
    to: "end"
flow:
  entry_point: "reviewer"
